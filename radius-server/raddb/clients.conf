# RADIUS clients configuration
# Define network devices that can send RADIUS requests

# Default client for testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Docker network clients
client docker-network {
    ipaddr = 172.16.0.0/12
    secret = testing123
    require_message_authenticator = yes
    nas_type = other
}

# Local network clients (adjust as needed)
client local-network {
    ipaddr = 192.168.0.0/16
    secret = your-radius-secret-here
    require_message_authenticator = yes
    nas_type = other
    shortname = local-net
}

client private-network-1 {
    ipaddr = 10.0.0.0/8  
    secret = your-radius-secret-here
    require_message_authenticator = yes
    nas_type = other
    shortname = private-net
}

