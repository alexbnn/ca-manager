# FreeRADIUS Configuration for EAP-TLS Certificate Authentication
# CA Manager Integration

prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = /usr/sbin
logdir = /var/log/radius
raddbdir = /etc/raddb
radacctdir = ${logdir}/radacct

name = radiusd

# Certificate directory
confdir = ${raddbdir}
run_dir = /var/run/radiusd
db_dir = ${raddbdir}
libdir = /usr/lib/freeradius
pidfile = ${run_dir}/radiusd.pid
certdir = ${confdir}/certs
cadir = ${confdir}/certs

# Module directories
modconfdir = ${confdir}/mods-config
moddir = ${modconfdir}/files

# Dictionary
dictionary = ${confdir}/dictionary

# Maximum time between Auth-Request packets
max_request_time = 30

# Cleanup delay
cleanup_delay = 5

# Maximum requests per session
max_requests = 16384

# Hostname lookups
hostname_lookups = no

# Regular expression library
regular_expressions = yes
extended_expressions = yes

# Logging
log {
    destination = files
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = no
    auth = yes
    auth_badpass = no
    auth_goodpass = no
}

# Check configuration syntax and quit
checkrad = ${sbindir}/checkrad

# Security settings
security {
    max_attributes = 200
    reject_delay = 1
    status_server = yes
    allow_vulnerable_openssl = no
    allow_core_dumps = no
    user = radius
    group = radius
    chroot = ""
}

# Proxy configuration
proxy_requests  = no

# Thread pool configuration
thread pool {
    start_servers = 5
    max_servers = 32
    min_spare_servers = 3
    max_spare_servers = 10
    max_requests_per_server = 0
    auto_limit_acct = no
}

# Module loading
modules {
    $INCLUDE mods-enabled/
}

# Instantiate modules
instantiate {
    exec
    expr
    expiration
    logintime
    pap
    chap
    mschap
    digest
    unix
    eap
    files
    detail
}

# Policies
$INCLUDE policy.d/

# Sites/Virtual Servers  
$INCLUDE sites-enabled/